*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.9;letter-spacing:.03em;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
a{color:var(--sage-deep);text-underline-offset:3px}

h1,h2,h3{word-break:auto-phrase}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.top .wrap{display:flex;align-items:center;gap:20px;padding-block:22px}
.wordmark{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;letter-spacing:.02em;color:var(--ink);text-decoration:none;line-height:1}
.nav{margin-left:auto;display:flex;gap:22px;font-size:12px;letter-spacing:.12em}

.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--sage-deep);text-transform:uppercase}
.hero h1{font-weight:500;font-size:clamp(30px,5.4vw,52px);line-height:1.45;letter-spacing:.05em;text-wrap:balance}

.lead{color:var(--muted);max-width:34em}
.toiro{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.toiro-dots{display:flex;gap:7px}
.toiro-dots span{width:14px;height:14px;border-radius:50%;background:var(--c)}
.toiro-label{font-size:11px;color:var(--muted);letter-spacing:.14em}
.meta-row{display:flex;gap:28px;flex-wrap:wrap;padding-top:22px;margin-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.meta-row b{display:block;font-family:var(--display);font-weight:500;font-size:30px;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:0}

.toolbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-block:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}

.search{position:relative;flex:1 1 240px;min-width:0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;white-space:nowrap}

.card.is-new{grid-column:1/-1;padding:30px 32px 24px}
.card-top{display:flex;align-items:center;gap:12px}
.date{font-family:var(--display);font-weight:500;font-size:22px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.tag{font-size:11px;color:var(--sage-deep);background:var(--tint);border-radius:999px;padding:3px 11px;letter-spacing:.06em;white-space:nowrap}
.new{font-size:10px;letter-spacing:.2em;color:var(--blush);border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.save{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer;color:var(--muted);transition:.2s;flex:none}
.save svg{width:13px;height:16px}
.save svg path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}

.save[aria-pressed="true"]{color:var(--sage-deep);border-color:var(--sage);background:var(--tint)}
.save[aria-pressed="true"] svg path{fill:currentColor}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;text-decoration:none;color:var(--ink);background:transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn svg{width:12px;height:12px;flex:none}
.btn:hover{border-color:var(--sage-deep);color:var(--sage-deep)}
.btn.primary{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper)}

.btn.quiet{border-color:transparent;color:var(--sage-deep);padding-inline:6px}
.btn.quiet:hover{text-decoration:underline}
.pass{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 5px 4px 13px;background:var(--paper);max-width:100%}

.empty{padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px}

.reading .wrap{padding-block:0 84px}
.read-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:28px 30px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);transition:box-shadow .25s,border-color .25s}

      {id:"2026-09-11-trial-reels",date:"2026-09-11",dateLabel:"9/11",month:"2026年9月",category:"テキスト配信",title:"トライアルリール、おすすめです",summary:"冒頭の違う動画を複数パターン試し、反応を見てから通常公開する方法。再生数以外の見方や、2段階で試す方法も紹介しています。",body:"【トライアルリール、おすすめです】\n\n今日のリール、夕方にトライアルリールを5本一気に回して、その中で一番伸びたものを3時間後に通常公開しました😚\n\nやり方はかなり簡単👇\n\n① 冒頭を5種類考える\nまず「伸びそうな冒頭」を5種類考えて台本を作る。冒頭以外の本編は全部共通でOK！\n\n② 冒頭だけ違う動画を5本作る\n動画編集もほぼ一緒で、冒頭部分だけ5パターン作る。キャプションも全部共通でOK。わたしはBGMだけそれぞれ変えてます！\n\n③ 5本まとめてトライアルリールに出す\n時間を空けずに、5本一気に出してOK！\n\n④ 一番反応がよかったものを通常公開する\nできれば1日くらい置いて数字を見た方が判断しやすいと思うんだけど、今日はもう時間がなくてその日のうちに公開したかったので、わたしは3時間くらいで判断しました！\n\n今日の場合、3時間くらいで\n・150回くらい\n・200回くらい\n・300回くらい\n・500回くらい\n・900回くらい\nという感じで結構差が出て、900回くらい回ってたものを採用して通常公開しました🙂‍↕️\n\nこれだけでも「自分ではこの冒頭がいいと思ってたけど、実際はこっちの方が反応いいんだ」って数字で判断できるので、普通に1本だけ出すよりかなり使えると思う💪✨\n\nあ、再生数だけじゃなくて、保存数、スキップ率、フォロー数とかももちろん見てるよ！\n\nBGMを変えてるのは、できるだけ同じ動画として認識されないようにするため😉\n冒頭とBGMが違えば、今のところわたしは5本出しても同じものとして扱われた感じはなかったです🙆\n\n逆に前に、過去に伸びたリールをリメイクして出そうと思って、冒頭の動画素材だけ変えて、アフレコとテロップはほぼ同じまま出したことがあって。そのときは過去の投稿と類似したコンテンツみたいな判定になって、全然伸びなかったことがありました🫠\n\nなので、過去投稿のリメイクと、同時にトライアルで複数パターンを試すのはちょっと分けて考えた方がいいかも🤔\n\nちなみに、もっとしっかり分析したい人は「2段階」でやるのもあり✊\n\n① まず冒頭の台本を5種類作ってトライアル\n② 一番伸びた台本を選ぶ\n③ 次はその台本のまま、冒頭の動画素材だけ5種類変えてもう一度トライアル\n④ さらに反応がよかったものを通常公開\n\nここまでやると、「言葉」と「映像」のどっちが強かったのかも見やすくなる🪿🍃\n\nあと、トライアルリールは通常公開したあとも消さなくて👌わたしはそのまま残してます☺️\n\nトライアルリールって、感覚としてはフォロワー外に出せる無料の広告みたいなものだと思ってて、通常公開しなくてもトライアル側で伸び続けることもあるし、そこからフォロワーが100人、200人と増えることもある🥹\n\n使ってない人もまだ結構いると思うけど、せっかく使える機能なので、リールを作るなら1本だけ作って感覚で公開するより、冒頭を何パターンか試して数字を見てから公開する使い方、かなりおすすめです🫶",links:[]}

posts.forEach(p=>{const pass=p.body.match(/^パスコード:\s*(.+)$/m);if(pass){const archive=(p.links||[]).find(x=>x.label==="アーカイブを見る");if(archive)archive.passcode=pass[1]}p.body=p.body.replace(/^【[^】]+】\n\n/,"").replace(/^▼.*(?:\n|$)/gm,"").replace(/^📹.*アーカイブ.*(?:\n|$)/gm,"").replace(/^パスコード:.*(?:\n|$)/gm,"").replace(/\n{3,}/g,"\n\n").trim()});

const CATS=["すべて","Instagram講座","テキスト配信","目標・マインド"];
const SAVED_KEY="yt-archive-saved-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon={
  ext:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 2H10v5.5M10 2L2.5 9.5"/></svg>',
  play:'<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.8v8.4L10 6z"/></svg>',
  read:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 3h8M2 6h8M2 9h5"/></svg>',
  bm:'<svg viewBox="0 0 16 20" aria-hidden="true"><path d="M3 2.5h10v15l-5-3.5-5 3.5z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l4 4 4-4"/></svg>'
};
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem(SAVED_KEY)||"[]"))}catch(e){}
let cat="すべて",savedOnly=false,query="";
const collapsed=new Set();
const sorted=[...posts].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const newestId=sorted[0]&&sorted[0].id;
const fmtDate=d=>{const [y,m,day]=d.split("-");return `${+m}.${day}`};

function storeSaved(){try{localStorage.setItem(SAVED_KEY,JSON.stringify([...saved]))}catch(e){}}

function renderMeta(){
  const latest=sorted[0];
  const cats=new Set(posts.map(p=>p.category)).size;
  $("metaRow").innerHTML=`<div><b>${posts.length}</b>配信アーカイブ</div><div><b>${cats}</b>カテゴリ</div>${latest?`<div><b>${fmtDate(latest.date)}</b>最新の配信</div>`:""}`;
}
function renderChips(){
  $("chips").innerHTML=CATS.map(c=>`<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${!savedOnly&&cat===c}">${esc(c)}</button>`).join("")+
  `<button type="button" class="chip" id="savedChip" aria-pressed="${savedOnly}">${icon.bm.replace('aria-hidden="true"','aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"')}保存したもの${saved.size?`（${saved.size}）`:""}</button>`;
}
function visible(){
  const q=query.trim().toLowerCase();
  return sorted.filter(p=>(savedOnly?saved.has(p.id):(cat==="すべて"||p.category===cat))&&(!q||`${p.title} ${p.summary} ${p.body} ${p.category}`.toLowerCase().includes(q)));
}
function linkBtns(p,inSheet){
  const links=p.links||[];
  let h=links.map((x,i)=>{
    const isArc=x.label==="アーカイブを見る";
    return `<a class="btn${isArc?" primary":""}" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${isArc?icon.play:icon.ext}${esc(x.label)}</a>`+
      (x.passcode?`<span class="pass">パスコード <code>${esc(x.passcode)}</code><button type="button" class="copy" data-code="${esc(x.passcode)}">コピー</button></span>`:"");
  }).join("");
  if(!inSheet&&p.body)h+=`<button type="button" class="btn quiet open" data-id="${p.id}">${icon.read}${links.length?"本文を読む":"内容を読む"}</button>`;
  return h;
}
function card(p,showNew){
  const isNew=showNew&&p.id===newestId;
  return `<article class="card${isNew?" is-new":""}">
    <div class="card-top"><time class="date" datetime="${p.date}">${fmtDate(p.date)}</time><span class="tag">${esc(p.category)}</span>${isNew?'<span class="new">NEW</span>':""}
      <button type="button" class="save" data-id="${p.id}" aria-pressed="${saved.has(p.id)}" aria-label="${saved.has(p.id)?"保存を解除":"保存する"}">${icon.bm}</button></div>
    <h3>${esc(p.title)}</h3>
    <p class="desc">${esc(p.summary)}</p>
    <div class="actions">${linkBtns(p,false)}</div>
  </article>`;
}
function render(){
  renderChips();
  const list=visible();
  $("count").textContent=`${list.length}件`;
  if(!list.length){$("list").innerHTML=`<div class="empty">${savedOnly?"まだ保存した配信はありません。カードの右上のしおりで保存できます。":"該当する配信が見つかりませんでした。"}</div>`;return}
  const showNew=!savedOnly&&cat==="すべて"&&!query.trim();
  const groups=new Map();list.forEach(p=>{if(!groups.has(p.month))groups.set(p.month,[]);groups.get(p.month).push(p)});
  $("list").innerHTML=[...groups].map(([m,items])=>{const open=!collapsed.has(m);return `<section class="month"><button type="button" class="month-btn" data-month="${esc(m)}" aria-expanded="${open}"><span class="m">${esc(m)}</span><span class="n">${items.length}件</span>${icon.chev}</button><div class="grid"${open?"":" hidden"}>${items.map(p=>card(p,showNew)).join("")}</div></section>`}).join("");
}
function openPost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  $("dlgMeta").innerHTML=`<time class="date" datetime="${p.date}">${fmtDate(p.date)}</time><span class="tag">${esc(p.category)}</span>`;
  $("dlgTitle").textContent=p.title;
  $("dlgBody").textContent=p.body;
  const acts=linkBtns(p,true);
  $("dlgActions").innerHTML=acts;$("dlgActions").hidden=!acts;
  const d=$("dlg");if(d.showModal)d.showModal();else d.setAttribute("open","");
  d.querySelector(".sheet").scrollTop=0;
}
function closePost(){const d=$("dlg");if(d.close)d.close();else d.removeAttribute("open")}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast("パスコードをコピーしました")}
  catch(e){const r=document.createRange(),el=[...document.querySelectorAll(".pass code")].find(c=>c.textContent===text);if(el){r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast("選択したのでコピーしてください")}
}

document.addEventListener("click",e=>{
  const t=e.target;
  const c=t.closest("[data-cat]");if(c){cat=c.dataset.cat;savedOnly=false;render();return}
  if(t.closest("#savedChip")){savedOnly=!savedOnly;render();return}
  const s=t.closest(".save");if(s){const id=s.dataset.id;saved.has(id)?saved.delete(id):saved.add(id);storeSaved();render();toast(saved.has(id)?"保存しました（このブラウザに残ります）":"保存を解除しました");return}
  const o=t.closest(".open");if(o){openPost(o.dataset.id);return}
  const cp=t.closest(".copy");if(cp){copy(cp.dataset.code);return}
  const m=t.closest(".month-btn");if(m){const k=m.dataset.month;collapsed.has(k)?collapsed.delete(k):collapsed.add(k);render();return}
});
$("search").addEventListener("input",e=>{query=e.target.value;render()});
$("dlgClose").addEventListener("click",closePost);
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))closePost()});
renderMeta();render();
</script>
